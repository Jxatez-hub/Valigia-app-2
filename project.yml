name: Valigia
options:
  bundleIdPrefix: it.valigia
  deploymentTarget:
    iOS: "16.0"
targets:
  Valigia:
    type: application
    platform: iOS
    sources:
      - Valigia
    info:
      path: Valigia/Info.plist
      properties:
        CFBundleDisplayName: Valigia
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.valigia.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
