name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa XcodeGen
        run: brew install xcodegen
      - name: Genera progetto Xcode
        run: xcodegen generate
      - name: Compila
        run: |
          xcodebuild -project Valigia.xcodeproj -scheme Valigia \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Crea IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Valigia.app Payload/
          zip -r Valigia.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Valigia-ipa
          path: Valigia.ipa
